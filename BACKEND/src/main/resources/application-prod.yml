# ─────────────────────────────────────────────────────────────
# PROD Profile — Production server ke liye
# Koi bhi default value NAHI — sabhi env vars server pe set karo
# Missing variable = app start nahi hogi (intentional)
# ─────────────────────────────────────────────────────────────

server:
  port: ${SERVER_PORT:2911}
  # IMPORTANT: nginx ke peeche hone par Spring ko X-Forwarded-* headers
  # trust karne chahiye — warna OAuth2 redirect URLs galat host banenge
  # aur generated links (http://backend:2911) bahar leak honge.
  forward-headers-strategy: framework
  servlet:
    # OAuth2 flow state session me store hoti hai — cookie Secure honi chahiye
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
      timeout: 5m

spring:
  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20           # Prod mein zyada connections
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      # NOTE: `validate` sirf tab sahi hai jab schema pehle se exist kare.
      # PEHLI deployment ke liye DDL_AUTO=update set karo (tables ban jayenge),
      # phir wapas `validate` pe switch kar do (production me auto-DDL nahi chahiye).
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── OAuth2 ────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user

    # ── JWT ─────────────────────────────────────────────────
    jwt:
      secret: ${JWT_SECRET}           # 64+ chars zaroori — no default
      allow-ephemeral-secret: false   # prod mein random fallback BAND
      issuer: ${JWT_ISSUER}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:300}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}  # 7 days prod mein
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
      admin-refresh-token-cookie-name: ${JWT_ADMIN_REFRESH_COOKIE_NAME:adminRefreshToken}
      cookie-secure: true             # Prod mein HTTPS zaroori
      cookie-http-only: true
      cookie-same-site: strict        # Prod mein strict
      cookie-domain: ${JWT_COOKIE_DOMAIN}

  # ── Mail (email verification / OTP) ─────────────────────────
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Redis (cache + JWT blacklist + OTP) ────────────────────────
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}      # prod me Redis password zaroori hai
      timeout: 5000ms
      client-type: JEDIS

# ── Swagger — PROD mein completely OFF ────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── App Config ────────────────────────────────────────────────
app:
  cors:
    front-end-url: ${FRONT_END_URL}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    log-otp: false                   # prod mein OTP log KABHI nahi hoga
  auth:
    frontend:
      success-redirect: ${FRONT_END_SUCCESS_REDIRECT}
      failure-redirect: ${FRONT_END_FAILURE_REDIRECT}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  security:
    blacklist:
      fail-closed: true                   # prod me revoked token Redis outage me bhi reject
  dev-tools:
    enabled: false                       # prod me dev tools BAND (sirf dev me)
  ratelimit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
      window-minutes: ${RATE_LIMIT_LOGIN_WINDOW:15}
    otp:
      max-attempts: ${RATE_LIMIT_OTP_MAX:5}
      window-minutes: ${RATE_LIMIT_OTP_WINDOW:15}
    resend:
      max-attempts: ${RATE_LIMIT_RESEND_MAX:3}
      window-minutes: ${RATE_LIMIT_RESEND_WINDOW:60}

# ── Logging — Prod mein sirf errors ───────────────────────────
logging:
  level:
    root: ERROR
    com.neha.StreamHub: WARN
    org.springframework.security: ERROR
    org.springframework.web: ERROR
  file:
    name: ${LOG_FILE_PATH:logs/streamhub.log}   # File mein save hoga
