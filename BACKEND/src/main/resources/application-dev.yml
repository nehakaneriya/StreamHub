# ─────────────────────────────────────────────────────────────
# DEV Profile — Local development ke liye
# Saari values .env file se aati hain (IntelliJ EnvFile plugin)
# Default values sirf tab use hongi jab .env set nahi ho
# ─────────────────────────────────────────────────────────────

server:
  port: 2911

spring:
  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/streamhubdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  # ── Session — OAuth2 ke liye zaroori ──────────────────────
  # OAuth2 flow mein nonce/state session mein store hoti hai
  # In-memory session dev ke liye theek hai
  session:
    store-type: none
    timeout: 300s    # 5 minute — OAuth2 flow complete hone ke liye kaafi hai

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── OAuth2 ────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID:test-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:test-client-secret}
            scope:
              - user:email
              - read:user

    # ── JWT ─────────────────────────────────────────────────
    jwt:
      # SECRET ENV SE AANA CHAHIYE. Agar set nahi hai to dev profile ek
      # EPHEMERAL (random, per-startup) secret generate karega — isse tokens
      # restart ke baad invalid ho jayenge, lekin hardcoded secret kabhi repo
      # me nahi jayega. Prod/QA mein ye allowed NAHI hai.
      secret: ${JWT_SECRET:}
      allow-ephemeral-secret: true
      issuer: ${JWT_ISSUER:streamhub.com}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:300}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
      admin-refresh-token-cookie-name: ${JWT_ADMIN_REFRESH_COOKIE_NAME:adminRefreshToken}
      # Env se override ho sakta hai — warna AWS/IP deploy me dev profile
      # bhi localhost domain wali cookie set karta tha (jo browser reject karta hai).
      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
      cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
      # Khaali = host-only cookie. IP ya public domain dono pe kaam karta hai.
      cookie-domain: ${JWT_COOKIE_DOMAIN:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      client-type: JEDIS
      jedis:
        pool:
          # Redis connection pool settings
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000ms

  # ── Mail (email verification / OTP) ───────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@streamhub.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── Swagger / OpenAPI — DEV mein ON ───────────────────────────
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# ── App Config ────────────────────────────────────────────────
app:
  cors:
    front-end-url: ${FRONT_END_URL:http://localhost:1304}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}            # OTP 5 min valid
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}  # resend 60 sec gap
    # "123456" wala universal fallback REMOVED — ab har OTP hamesha random hai.
    # Dev me test karne ke liye real (random) OTP console me log hota hai — niche dekho.
    # DEV ONLY: real OTP console me log karo — SMTP fail hone par bhi flow test
    # kar sako. Prod/QA me hamesha false.
    log-otp: ${OTP_LOG_ENABLED:true}
  auth:
    frontend:
      success-redirect: ${FRONT_END_SUCCESS_REDIRECT:http://localhost:1304/oauth/success}
      failure-redirect: ${FRONT_END_FAILURE_REDIRECT:http://localhost:1304/oauth/failure}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    # Password env se aaye. Blank hai to ek random strong password generate hoga
    # aur startup log me print hoga (set ADMIN_PASSWORD to fix it).
    password: ${ADMIN_PASSWORD:}
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
  security:
    blacklist:
      # Dev me fail-OPEN — local Redis band ho to app pura down na ho.
      # (Prod/QA me true hai.)
      fail-closed: false
  dev-tools:
    # DEV ONLY — /api/v1/dev/mail-test se SMTP test karne ke liye.
    # QA/Prod me false hai (wahan ye controller load hi nahi hota).
    enabled: ${DEV_TOOLS_ENABLED:true}
  ratelimit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
      window-minutes: ${RATE_LIMIT_LOGIN_WINDOW:15}
    otp:
      max-attempts: ${RATE_LIMIT_OTP_MAX:5}
      window-minutes: ${RATE_LIMIT_OTP_WINDOW:15}
    resend:
      max-attempts: ${RATE_LIMIT_RESEND_MAX:3}
      window-minutes: ${RATE_LIMIT_RESEND_WINDOW:60}

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.neha.StreamHub: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

