# ─────────────────────────────────────────────────────────────
# QA Profile — Testing environment ke liye
# Dev aur Prod ke beech ka environment
# Real data nahi — test data use hota hai
# ─────────────────────────────────────────────────────────────

server:
  port: ${SERVER_PORT:2912}       # Dev se alag port taaki conflict na ho

spring:
  # ── Database — QA ka alag test database ───────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/videostreamdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── OAuth2 ────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID:test-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:test-client-secret}
            scope:
              - user:email
              - read:user

    # ── JWT ─────────────────────────────────────────────────
    jwt:
      # QA mein bhi secret env se hi aayega — koi hardcoded fallback nahi.
      secret: ${JWT_SECRET:}
      allow-ephemeral-secret: false
      issuer: ${JWT_ISSUER:qa.videostream.com}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:600}    # QA mein thoda zyada time
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
      admin-refresh-token-cookie-name: ${JWT_ADMIN_REFRESH_COOKIE_NAME:adminRefreshToken}
      cookie-secure: false
      cookie-http-only: true
      cookie-same-site: lax
      cookie-domain: localhost

  # ── Mail (email verification / OTP) ─────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@videostream.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Redis (cache + JWT blacklist + OTP) ────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      client-type: JEDIS

# ── Swagger — QA mein ON (testing ke liye) ────────────────────
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# ── App Config ────────────────────────────────────────────────
app:
  cors:
    front-end-url: ${FRONT_END_URL:http://localhost:1304}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    log-otp: false                       # QA me OTP log nahi hoga
  auth:
    frontend:
      success-redirect: ${FRONT_END_SUCCESS_REDIRECT:http://localhost:1304/oauth/success}
      failure-redirect: ${FRONT_END_FAILURE_REDIRECT:http://localhost:1304/oauth/failure}
  admin:
    email: ${ADMIN_EMAIL:qa-admin@videostream.com}
    password: ${ADMIN_PASSWORD:}          # Blank hoga to random password log hoga
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
  security:
    blacklist:
      fail-closed: true                   # QA me revoked token Redis outage me bhi reject
  dev-tools:
    enabled: false                       # QA me dev tools band
  ratelimit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
      window-minutes: ${RATE_LIMIT_LOGIN_WINDOW:15}
    otp:
      max-attempts: ${RATE_LIMIT_OTP_MAX:5}
      window-minutes: ${RATE_LIMIT_OTP_WINDOW:15}
    resend:
      max-attempts: ${RATE_LIMIT_RESEND_MAX:3}
      window-minutes: ${RATE_LIMIT_RESEND_WINDOW:60}

# ── Logging — QA mein detailed ────────────────────────────────
logging:
  level:
    root: WARN
    com.neha.VideoStreamApp: DEBUG    # App ka code debug level pe
    org.springframework.security: INFO
    org.springframework.web: WARN
