networks:
  videostream-net:
    driver: bridge

volumes:
  mysql-data:
  backend-videos:
  backend-hls:

services:
  # ── 1. MySQL Database ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: videostream-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-videostreamdb}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videostream-net

  # ── 2. Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7.0
    container_name: videostream-redis
    restart: unless-stopped
    # Password set karo — passwordless Redis koi bhi access kar sakta hai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-videostream_redis_pass}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-videostream_redis_pass}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping", "-a", "${REDIS_PASSWORD:-videostream_redis_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videostream-net

  # ── 3. Spring Boot Backend (Java 21 + FFmpeg) ───────────────
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: videostream-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-videostreamdb}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-videostream_redis_pass}

      # JWT
      # NOTE: Default secret prod me use KABHI mat karna — apna 64+ char
      # random secret .env me set karo. (JWT_SECRET env se hi aayega)
      JWT_SECRET: ${JWT_SECRET:-changeme_generate_a_64_char_random_secret_key_for_production_use_123456}
      JWT_ISSUER: ${JWT_ISSUER:-videostream.com}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-300}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-86400}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refreshToken}
      JWT_ADMIN_REFRESH_COOKIE_NAME: ${JWT_ADMIN_REFRESH_COOKIE_NAME:-adminRefreshToken}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY:-true}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-lax}
      # NOTE: `${VAR-}` (colon ke bina) — `${VAR:-default}` me KHALI value bhi
      # default le leta tha. IP-based deploy me domain khali chhodna zaroori hai
      # (browser "Domain=1.2.3.4" wale cookies reject karta hai) — isliye
      # default localhost nahi, khaali rakhna hai.
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN-}

      # Admin Default
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      # Blank chhodne par app ek random strong password generate karke log karega
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-true}

      # Frontend URLs
      FRONT_END_URL: ${FRONT_END_URL:-http://localhost}
      FRONT_END_SUCCESS_REDIRECT: ${FRONT_END_SUCCESS_REDIRECT:-http://localhost/oauth/success}
      FRONT_END_FAILURE_REDIRECT: ${FRONT_END_FAILURE_REDIRECT:-http://localhost/oauth/failure}

      # OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-client-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-test-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-test-client-secret}

      # Mail
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@videostream.com}

      # Storage (Mounted to Docker volumes)
      VIDEO_STORAGE_PATH: /app/videos/
      HLS_STORAGE_PATH: /app/videos_hls/
    volumes:
      - backend-videos:/app/videos
      - backend-hls:/app/videos_hls
    ports:
      - "2911:2911"
    healthcheck:
      # App alive hai ya nahi — depends_on ke liye zaroori hai
      test: ["CMD", "curl", "-fsS", "http://localhost:2911/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - videostream-net

  # ── 4. React Frontend (Nginx Reverse Proxy) ─────────────────
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_BACKEND_URL: ""
    container_name: videostream-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "1304:80"
    networks:
      - videostream-net
