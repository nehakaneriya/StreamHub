# ============================================================
# StreamHub Frontend — Nginx config
# SPA routing + backend API/OAuth2 reverse proxy
# ============================================================

# Agar TLS kisi doosre proxy (Caddy / host Nginx / ALB) pe terminate hota hai,
# to asli scheme X-Forwarded-Proto me aati hai. Yahan `$scheme` use karne se
# Spring ko http dikhta, OAuth ka redirect_uri http://... ban jata, aur Google
# "redirect_uri_mismatch" deta hai. Isliye forwarded proto preserve karo.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large video uploads — backend ke multipart limit (100MB) se zyada rakhna
    # safe hai, taaki nginx pehle hi reject na ho
    client_max_body_size 100M;

    # ── Security response headers ──────────────────────────────
    # Video titles/comments user-supplied hote hain — CSP ek extra layer hai
    # agar kabhi dangerouslySetInnerHTML aa jaaye.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── React Router SPA fallback ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ──────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:2911/api/;
        # $http_host port bhi preserve karta hai (IP:1304 test ke liye zaroori)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cookie_path / /;

        # Video upload + FFmpeg processing lamba le sakta hai — default 60s
        # timeout se 504 aa jata tha
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Upload ko buffer na karo — badi file disk par jayegi, memory par nahi
        proxy_request_buffering off;
    }

    # ── OAuth2 login/redirect proxy ─────────────────────────────
    location /oauth2/ {
        proxy_pass http://backend:2911/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:2911/login/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ── Static assets caching ───────────────────────────────────
    # NOTE: Ye REGEX location hai, jo prefix location se zyada priority rakhta
    # hai — isliye ise /api/ ke BAAD rakha gaya hai. Varna "/api/...json" jaise
    # paths bhi static root se serve ho jate (aur 404 dete).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html cache mat karo — naye deploy ke baad stale HTML na mile
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
